<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plants vs. Zombies C++ Web Preview</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #1d352c;
      color: #f6edc8;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      display: grid;
      place-items: center;
      gap: 12px;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      letter-spacing: 0.03em;
    }

    p {
      max-width: 760px;
      margin: 0;
      line-height: 1.45;
      text-align: center;
    }

    canvas {
      width: min(100%, 820px);
      height: auto;
      border: 4px solid #d8c27a;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgb(0 0 0 / 45%);
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Plants vs. Zombies C++ Web Preview</h1>
    <p>
      This browser preview is built from C++ with Emscripten and SDL2. It is a
      lightweight playable preview for GitHub Pages; the main desktop version
      remains the SFML build.
    </p>
    <canvas id="canvas" width="820" height="620" oncontextmenu="event.preventDefault()"></canvas>
    <p>Click a seed card, then click the lawn. Sun is collected automatically.</p>
  </main>
  <script>
    var Module = {
      canvas: document.getElementById("canvas")
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
